name: CI

on:
  push:
    branches: [main]
    # Two release tags, because the library and the CLI have different dependency sets.
    #   v<version>      publishes PhoenixmlDb.XQuery      (needs Core only)
    #   cli-v<version>  publishes PhoenixmlDb.XQuery.Cli  (needs Xslt of this train, which
    #                   only exists after the xslt repo has published it)
    # See Directory.Packages.props for why that ordering is required.
    tags: ["v*", "cli-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Resolve and guard version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then echo "::error::No <Version> in Directory.Build.props"; exit 1; fi
          # Which half of the train is this? A cli-v tag packs the CLI, a v tag the library.
          PHASE=library
          case "${GITHUB_REF_NAME}" in cli-v*) PHASE=cli ;; esac
          EXPECTED="v$VERSION"
          [ "$PHASE" = "cli" ] && EXPECTED="cli-v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$EXPECTED" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != $EXPECTED (Directory.Build.props). Align them before releasing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION, phase $PHASE (ref ${GITHUB_REF_NAME}, type ${GITHUB_REF_TYPE})"

      - name: Engine pins are not stale
        run: ./scripts/check-pins.sh

      # Only on the CLI tag. The library does not depend on Xslt, so demanding equality on a
      # v<version> tag would fail for a pin the library never uses. On cli-v<version> the Xslt
      # of this train IS published, so the pin must equal it — that is the whole reason the
      # tags are split. Fails closed if no train-locked pin is found.
      - name: Engine pins match this release train
        if: steps.version.outputs.phase == 'cli' && startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check-release-train.sh "${{ steps.version.outputs.version }}"

      - name: Restore
        run: |
          dotnet restore src/PhoenixmlDb.XQuery
          dotnet restore src/PhoenixmlDb.XQuery.Cli

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build src/PhoenixmlDb.XQuery -c Release --no-restore -p:Version="$BUILD_VERSION"
          dotnet build src/PhoenixmlDb.XQuery.Cli -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Test
        run: |
          dotnet test tests/PhoenixmlDb.XQuery.Tests -c Release
          dotnet test tests/PhoenixmlDb.XQuery.LanguageServer.Tests -c Release
          # The CLI carries its own ResultSerializer, separate from the engine's. It shipped an
          # inverted array/sequence case precisely because nothing here ran against it — this
          # list is explicit, so a new test project is invisible to CI until it is added.
          dotnet test tests/PhoenixmlDb.XQuery.Cli.Tests -c Release

      - name: Extract release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER="${{ steps.version.outputs.version }}"
          NOTES=$(awk -v v="## $VER " 'index($0,v)==1{grab=1;next} grab&&/^## /{exit} grab{print}' RELEASES.md)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASES.md section for $VER"; exit 1
          fi
          # MSBuild's -p:/-property: switch parser splits values on unescaped
          # ';' AND ',' (both act as property/item-list separators) and treats
          # '%' as its escape lead-in; a literal '"' is silently stripped
          # (not an error, just data loss). Escape all four so the notes
          # survive as one -p:PackageReleaseNotes value; MSBuild un-escapes
          # them back in the nuspec. '%' MUST be escaped FIRST so its own
          # escape sequences aren't double-escaped. The value is delivered to
          # pack via env: below, NEVER spliced into the shell, so backticks in
          # the notes are inert (avoids GitHub expression-splicing injection).
          NOTES=${NOTES//%/%25}
          NOTES=${NOTES//;/%3B}
          NOTES=${NOTES//,/%2C}
          NOTES=${NOTES//\"/%22}
          { echo "notes<<__RELNOTES_EOF__"; printf '%s\n' "$NOTES"; echo "__RELNOTES_EOF__"; } >> "$GITHUB_OUTPUT"

      # Each tag packs exactly one artifact. Packing both on one tag is what forced the CLI's
      # Xslt pin to trail a train behind — see Directory.Packages.props.
      - name: Pack library
        if: steps.version.outputs.phase == 'library' && startsWith(github.ref, 'refs/tags/')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          dotnet pack src/PhoenixmlDb.XQuery -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" \
            -p:PackageReleaseNotes="$PKG_NOTES" \
            -o ./artifacts

      - name: Pack CLI
        if: steps.version.outputs.phase == 'cli' && startsWith(github.ref, 'refs/tags/')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          PKG_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          dotnet pack src/PhoenixmlDb.XQuery.Cli -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" \
            -p:PackageReleaseNotes="$PKG_NOTES" \
            -o ./artifacts

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Windows: the same job as phoenixmldb-xslt's test-windows (xslt#196). We ship the xquery CLI
  # to Windows users, and until this job existed no CI ran there. Its first run in the xslt repo
  # found a real defect (xslt#197) and confirmed the #80 encoding fix on Windows, which no Linux
  # job could do. A `publish` dependency: a red Windows run stops a tag reaching nuget.org.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Test
        run: |
          dotnet test tests/PhoenixmlDb.XQuery.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PhoenixmlDb.XQuery.LanguageServer.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/PhoenixmlDb.XQuery.Cli.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # #80 on the platform where it happens, under the legacy code page Martin Honnen's console
      # uses (chcp 1252). The runner's own default is UTF-8, which masks the bug, so the published
      # pre-fix 2.2.0 runs as a control and must produce DIFFERENT bytes, or the step fails.
      # Redirect through cmd: PowerShell's `>` re-encodes and would hide the raw bytes.
      - name: CLI writes UTF-8 on Windows (#80)
        run: |
          dotnet build src/PhoenixmlDb.XQuery.Cli -c Release -f net10.0 --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $d = Join-Path $env:RUNNER_TEMP enc; New-Item -ItemType Directory -Force $d | Out-Null
          Set-Content -Encoding utf8NoBOM "$d\q.xq" '"Stra&#223;en &#8594; ok"'
          $want = [byte[]](0x53,0x74,0x72,0x61,0xC3,0x9F,0x65,0x6E,0x20,0xE2,0x86,0x92,0x20,0x6F,0x6B)
          function Bytes($exe, $out) {
            cmd /c "chcp 1252 >NUL & `"$exe`" -f `"$d\q.xq`" < NUL > `"$out`" 2> `"$out.err`""
            $b = [IO.File]::ReadAllBytes($out)
            ($b | Select-Object -First $want.Length | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          }
          $wantHex = ($want | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          $cand = Bytes "src\PhoenixmlDb.XQuery.Cli\bin\Release\net10.0\xquery.exe" "$d\cand.txt"
          dotnet tool install --tool-path "$d\old" xquery4 --version 2.2.0 | Out-Null
          $old  = Bytes "$d\old\xquery.exe" "$d\old.txt"
          Write-Host "expected (UTF-8): $wantHex"
          Write-Host "candidate:        $cand"
          Write-Host "2.2.0 (pre-fix):  $old"
          if ($cand -ne $wantHex) { Write-Host "::error::CLI output is not UTF-8 on Windows (#80)"; exit 1 }
          if ($old -eq $wantHex) { Write-Host "::error::The pre-fix 2.2.0 also wrote UTF-8 under chcp 1252, so this check cannot tell fixed from broken."; exit 1 }
          Write-Host "Discriminating: the pre-fix CLI produced different bytes, so the pass means the fix works."

  publish:
    # `build` runs the test suites as one of its steps, so this DOES gate a release on tests —
    # a red suite fails build, and publish never runs. Checked 2026-09-10 rather than assumed:
    # phoenixmldb-xslt keeps tests in a separate job and had to be gated explicitly, and the
    # same edit was briefly applied here, referencing a `test` job that does not exist and
    # breaking the workflow file. Two repos, two shapes.
    needs: [build, test-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Login to NuGet via trusted publisher
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: endpointsystems

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
